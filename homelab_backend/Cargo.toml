[package]
name = "homelab_backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = {  version = "0.8.9", features = ["macros", "ws"] }
axum-extra = {  version = "0.12.6", features = ["query"] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["full", "util"] }
tracing-subscriber = "0.3.23"
dotenv = "0.15.0"
dotenv_codegen = "0.15.0"
rand = "0.10"
sha2 = "0.11.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "http1", "client-legacy"] }
http-body-util = "0.1.3"
tracing = "0.1"
futures = "0.3.32"

# Used for testing ws connections
tokio-tungstenite = "0.29.0"

[dependencies.mongodb]
version = "3.7.0"
